      // =========================
      // I18N ENGINE V4 - stable
      // =========================
      // IMPORTANT : on ne fait PLUS de remplacement par sous-chaîne du type
      // "Confirmer" -> "Confirm". C'était la cause de "Confirmererée",
      // "plats متاحs", "محجوزةe", etc.
      // Chaque texte est d'abord normalisé vers sa source française, puis
      // traduit une seule fois vers la langue choisie.
      const CORRUPTED_TO_FR = {
        Confirmererée: "Confirmée",
        Confirmerée: "Confirmée",
        Confirmerer: "Confirmer",
        متاحs: "disponibles",
        متاحةs: "disponibles",
        متاحe: "disponible",
        متاحةe: "disponible",
        محجوزةe: "Réservée",
        محجوزe: "Réservé",
        مؤكدةe: "Confirmée",
        مؤكدe: "Confirmé",
        الحجزs: "Réservations",
        "la réclamation": "la réclamation",
        "l'avi": "l'avis",
        "l'avis": "l'avis",
        "LES LES LES": "LES",
        "LES LES": "LES",
        Confirmerererererée: "Confirmée",
        Confirmerererée: "Confirmée",
        Confirmererée: "Confirmée",
        الحجزs: "Réservations",
        متاحةe: "Disponible",
        متاحe: "Disponible",
        محجوزةe: "Réservée",
      };

      function escapeRegExp(text) {
        return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      // Nettoyage des anciennes traductions corrompues vues après plusieurs re-renders.
      const CORRUPTED_PATTERNS = [
        [/إرسال التقييمs+/g, "إرسال التقييم"],
        [/إرسال l[’\']avis/g, "إرسال التقييم"],
        [/Send l[’\']avis/g, "Send review"],
        [/Envoyer l[’\']avis/g, "Envoyer l'avis"],
        [/Confirmerer+ée/g, "Confirmée"],
        [/Confirmerer+/g, "Confirmer"],
        [/محجوزةe+/g, "محجوزة"],
        [/متاحs+/g, "disponibles"],
        [/متاحةs+/g, "disponibles"],
        [/الحجزs+/g, "Réservations"],
      ];

      function normalizeCorrupted(value) {
        let result = String(value ?? "");
        // Répare les suffixes/concaténations produites par les anciens moteurs.
        CORRUPTED_PATTERNS.forEach(([pattern, replacement]) => {
          result = result.replace(pattern, replacement);
        });
        // Les erreurs issues d'anciens rendus sont réparées AVANT toute traduction.
        Object.keys(CORRUPTED_TO_FR)
          .sort((a, b) => b.length - a.length)
          .forEach((bad) => {
            result = result.split(bad).join(CORRUPTED_TO_FR[bad]);
          });
        result = result.replace(/\bLES(?:\s+LES){1,}\b/g, "LES");
        return result;
      }

      function buildCanonicalPairs() {
        const pairs = [];
        ["en", "ar"].forEach((lang) => {
          const map = TRANSLATIONS[lang] || {};
          Object.keys(map).forEach((fr) => {
            const translated = map[fr];
            if (!fr || !translated || fr === translated) return;
            pairs.push({ fr, translated, lang });
          });
        });
        // Phrases longues d'abord : évite les collisions comme
        // "Réservations par statut" + "Réservations".
        return pairs.sort((a, b) => b.translated.length - a.translated.length);
      }

      const CANONICAL_PAIRS = buildCanonicalPairs();

      function canonicalFrench(value) {
        if (value === null || value === undefined || value === "") return value;
        let result = normalizeCorrupted(value);

        // 1) Remplacement EXACT quand tout le noeud correspond à une traduction.
        for (const pair of CANONICAL_PAIRS) {
          if (result.trim() === pair.translated.trim()) {
            return pair.fr;
          }
        }

        // 2) Pour les phrases dynamiques (ex: "44 dishes available"),
        // on remplace uniquement des mots/phrases connus, jamais des fragments.
        for (const pair of CANONICAL_PAIRS) {
          const t = pair.translated;
          if (!t || t.length < 2) continue;
          if (!result.includes(t)) continue;

          if (/^[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9'’ .·+×/-]*$/.test(t)) {
            const re = new RegExp(
              "(?<![A-Za-zÀ-ÿ])" + escapeRegExp(t) + "(?![A-Za-zÀ-ÿ])",
              "gi"
            );
            result = result.replace(re, pair.fr);
          } else {
            result = result.split(t).join(pair.fr);
          }
        }
        return normalizeCorrupted(result);
      }

      function translateKnownPartsFrench(value, lang) {
        let result = String(value ?? "");
        const map = TRANSLATIONS[lang] || {};
        const entries = Object.keys(map)
          .filter((key) => key && map[key] && key !== map[key])
          .sort((a, b) => b.length - a.length);

        for (const key of entries) {
          const translated = map[key];
          // Phrases avec espaces/punctuation : remplacement sûr.
          if (/\s|[·×/!?.,:;()—–-]/.test(key)) {
            result = result.split(key).join(translated);
            continue;
          }
          // Mots français : limites de mot pour empêcher
          // "Confirmer" de casser "Confirmée" ou "Réserver" etc.
          const re = new RegExp(
            "(?<![A-Za-zÀ-ÿ])" + escapeRegExp(key) + "(?![A-Za-zÀ-ÿ])",
            "g"
          );
          result = result.replace(re, translated);
        }
        return result;
      }

      function translateString(value, lang = getLanguage()) {
        if (value === null || value === undefined || value === "") return value;

        // Source stable = français, même si React a recréé un noeud avec
        // une ancienne traduction ou une chaîne mélangée.
        let french = canonicalFrench(value);
        french = normalizeCorrupted(french);

        if (lang === "fr") return french;

        let result = translateKnownPartsFrench(french, lang);

        // Cas dynamiques/mélangés connus : on nettoie les suffixes parasites.
        if (lang === "ar") {
          result = result
            .replace(/إرسال l[’\']avis/gi, "إرسال التقييم")
            .replace(/إرسال التقييمs+/gi, "إرسال التقييم")
            .replace(/متاحs/g, "متاحة")
            .replace(/متاحةs/g, "متاحة")
            .replace(/محجوزةe/g, "محجوزة")
            .replace(/مؤكدةe/g, "مؤكدة")
            .replace(/Confirmererée/g, "مؤكدة")
            .replace(/Confirmerée/g, "مؤكدة");
        }
        if (lang === "en") {
          result = result
            .replace(/متاحs/g, "available")
            .replace(/متاحةs/g, "available")
            .replace(/محجوزةe/g, "Reserved")
            .replace(/مؤكدةe/g, "Confirmed")
            .replace(/Confirmererée/g, "Confirmed")
            .replace(/Confirmerée/g, "Confirmed");
        }
        return result;
      }

      function getLanguage() {
        return localStorage.getItem("voilier_lang") || "fr";
      }

      function translateText(value, lang = getLanguage()) {
        return translateString(value, lang);
      }

      function translateDOM() {
        if (isTranslatingDOM) return;
        const lang = getLanguage();
        const root = document.body;
        if (!root) return;
        isTranslatingDOM = true;
        root.classList.toggle("rtl", lang === "ar");
        document.documentElement.lang = lang;
        root.dir = lang === "ar" ? "rtl" : "ltr";

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let node;
        while ((node = walker.nextNode())) nodes.push(node);

        nodes.forEach((textNode) => {
          const parent = textNode.parentElement;
          if (
            !parent ||
            ["SCRIPT", "STYLE", "TEXTAREA", "INPUT"].includes(parent.tagName)
          )
            return;
          if (parent.closest(".language-switcher")) return;

          const current = textNode.nodeValue || "";
          let original = languageOriginalText.get(textNode);
          const last = languageLastTranslatedText.get(textNode);
          if (
            original === undefined ||
            (last !== undefined && current !== last)
          ) {
            // React peut recréer le noeud avec une traduction déjà affichée.
            // Ne JAMAIS mémoriser cette traduction comme texte source.
            original = canonicalFrench(current);
            languageOriginalText.set(textNode, original);
          }
          const translated = translateString(original, lang);
          if (current !== translated) textNode.nodeValue = translated;
          languageLastTranslatedText.set(textNode, translated);
        });

        root
          .querySelectorAll("[placeholder],[title],[data-tooltip],[aria-label]")
          .forEach((el) => {
            if (el.closest(".language-switcher")) return;
            let originals = languageOriginalAttrs.get(el);
            let lasts = languageLastTranslatedAttrs.get(el);
            if (!originals) {
              originals = {};
              languageOriginalAttrs.set(el, originals);
            }
            if (!lasts) {
              lasts = {};
              languageLastTranslatedAttrs.set(el, lasts);
            }
            ["placeholder", "title", "data-tooltip", "aria-label"].forEach(
              (attr) => {
                if (!el.hasAttribute(attr)) return;
                const current = el.getAttribute(attr) || "";
                if (
                  originals[attr] === undefined ||
                  (lasts[attr] !== undefined && current !== lasts[attr])
                )
                  originals[attr] = current;
                const translated = translateString(originals[attr], lang);
                if (current !== translated) el.setAttribute(attr, translated);
                lasts[attr] = translated;
              }
            );
          });
        isTranslatingDOM = false;
      }

      function setLanguage(lang) {
        if (!["fr", "en", "ar"].includes(lang)) return;

        // IMPORTANT : on ne traduit pas un DOM déjà traduit.
        // On sauvegarde la langue puis on recharge l'application : React
        // reconstruit alors toute l'interface depuis ses textes français
        // d'origine, puis le moteur applique UNE SEULE traduction.
        // Cela évite définitivement : Confirmererée, الحجزs, متاحs,
        // LES LES LES, et les mélanges FR/EN/AR après plusieurs changements.
        const current = getLanguage();
        localStorage.setItem("voilier_lang", lang);
        if (current !== lang) {
          window.location.reload();
          return;
        }
        translateDOM();
        window.dispatchEvent(
          new CustomEvent("voilier-language-changed", { detail: lang })
        );
      }

      function LanguageSwitcher() {
        const [lang, setLang] = useState(getLanguage());
        useEffect(() => {
          const handler = (e) => setLang(e.detail || getLanguage());
          window.addEventListener("voilier-language-changed", handler);
          translateDOM();
          return () =>
            window.removeEventListener("voilier-language-changed", handler);
        }, []);
        return (
          <div className="language-switcher" title="Langue / Language / اللغة">
            <span className="language-icon">🌐</span>
            {[
              ["fr", "FR"],
              ["en", "EN"],
              ["ar", "AR"],
            ].map(([code, label]) => (
              <button
                key={code}
                type="button"
                className={lang === code ? "active" : ""}
                aria-label={
                  code === "fr"
                    ? "Français"
                    : code === "en"
                    ? "English"
                    : "العربية"
                }
                onClick={() => {
                  setLang(code);
                  setLanguage(code);
                }}
              >
                {label}
              </button>
            ))}
          </div>
        );
      }

      let languageObserverStarted = false;
      function startLanguageObserver() {
        if (languageObserverStarted || !document.body) return;
        languageObserverStarted = true;
        const observer = new MutationObserver(() => {
          if (isTranslatingDOM) return;
          clearTimeout(window.__voilierTranslateTimer);
          window.__voilierTranslateTimer = setTimeout(translateDOM, 120);
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true,
          attributes: true,
          attributeFilter: [
            "placeholder",
            "title",
            "data-tooltip",
            "aria-label",
          ],
        });
        translateDOM();
      }

      function readLocalJSON(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : fallback;
        } catch {
          return fallback;
        }
      }
      function writeLocalJSON(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }
      async function safeJson(url, options = {}, fallback = []) {
        try {
          const r = await apiFetch(url, options);
          if (!r.ok) return fallback;
          return await r.json();
        } catch {
          return fallback;
        }
      }
      function formatDT(n) {
        return `${Number(n || 0).toFixed(3)} DT`;
      }
      function startOfMonth(d = new Date()) {
        return new Date(d.getFullYear(), d.getMonth(), 1);
      }
      function sameMonth(value, ref = new Date()) {
        if (!value) return false;
        const d = new Date(value);
        const r = startOfMonth(ref);
        return (
          d.getFullYear() === r.getFullYear() && d.getMonth() === r.getMonth()
        );
      }
      function ReservationDateValue(r) {
        return r?.date || r?.createdAt || r?.dateReservation || "";
      }

      /*
       * BACKEND CONTRACTS POUR LES NOUVELLES FONCTIONNALITÉS
       * POST /loyalty/earn, GET /loyalty/me, POST /loyalty/redeem
       * CRUD /promos + validation serveur des dates/limites d'utilisation
       * CRUD /offres-du-jour + activation/désactivation
       * GET /analytics/peak-hours, /analytics/top-dishes, /analytics/monthly
       * POST /payments/deposit + webhook Stripe/PayPal (ne jamais valider le paiement côté client)
       * POST /notifications/send-reminder + worker/scheduler 24h/2h
       * WebSocket /ws/notifications pour admin/client
       * CRUD /staff/shifts, /suppliers, /ingredients, /stock/movements
       * GET /tables/{id}/qr + POST /orders pour QR commande
       * POST /invoices/pdf ou génération serveur pour facture/ticket
       * GET /audit-logs pour la traçabilité admin
       * POST /backups (admin uniquement) ou job serveur quotidien
       * PWA: manifest.json + service-worker.js + cache stratégie offline
       */
      function SectionBusinessHub({ token }) {
        const [reservations, setReservations] = useState([]);
        const [clients, setClients] = useState([]);
        const [plats, setPlats] = useState([]);
        const [promos, setPromos] = useState(() =>
          readLocalJSON("voilier_promos", [])
        );
        const [offers, setOffers] = useState(() =>
          readLocalJSON("voilier_offres", [])
        );
        const [avgBasket, setAvgBasket] = useState(() =>
          Number(localStorage.getItem("voilier_avg_basket") || 35)
        );
        const [promoCode, setPromoCode] = useState("");
        const [promoValue, setPromoValue] = useState(10);
        const [offerName, setOfferName] = useState("Menu du jour");
        const [offerDesc, setOfferDesc] = useState("Plat du jour + boisson");
        const [offerPrice, setOfferPrice] = useState(25);
        const [loading, setLoading] = useState(true);

        const load = async () => {
          setLoading(true);
          const [rs, cs, ps] = await Promise.all([
            safeJson(
              `${API_URL}/reservations`,
              { headers: { Authorization: `Bearer ${token}` } },
              []
            ),
            safeJson(
              `${API_URL}/clients`,
              { headers: { Authorization: `Bearer ${token}` } },
              []
            ),
            safeJson(`${API_URL}/plats`, {}, []),
          ]);
          setReservations(Array.isArray(rs) ? rs : rs?.reservations || []);
          setClients(Array.isArray(cs) ? cs : cs?.clients || []);
          setPlats(Array.isArray(ps) ? ps : []);
          setLoading(false);
        };
        useEffect(() => {
          load();
        }, []);

        const activeReservations = reservations.filter(
          (r) => !["Annulée", "Annulee", "cancelled"].includes(r.statut)
        );
        const noShows = reservations.filter((r) =>
          ["No-show", "No Show", "Absent"].includes(r.statut)
        );
        const cancellations = reservations.filter((r) =>
          ["Annulée", "Annulee", "cancelled"].includes(r.statut)
        );
        const cancellationRate = reservations.length
          ? Math.round((cancellations.length / reservations.length) * 100)
          : 0;
        const people = activeReservations.reduce(
          (a, r) => a + Number(r.nombrePersonnes || 0),
          0
        );
        const estimatedRevenue = people * Number(avgBasket || 0);
        const monthNow = reservations.filter((r) =>
          sameMonth(ReservationDateValue(r))
        ).length;
        const lastMonthRef = new Date();
        lastMonthRef.setMonth(lastMonthRef.getMonth() - 1);
        const monthPrev = reservations.filter((r) =>
          sameMonth(ReservationDateValue(r), lastMonthRef)
        ).length;
        const delta = monthPrev
          ? Math.round(((monthNow - monthPrev) / monthPrev) * 100)
          : monthNow
          ? 100
          : 0;

        const hourMap = {};
        activeReservations.forEach((r) => {
          const h = String(r.heure || "").slice(0, 2);
          if (h) hourMap[h] = (hourMap[h] || 0) + 1;
        });
        const peak = Object.entries(hourMap)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);
        const dishScores = plats
          .map((p) => ({
            name: p.nom,
            score: Number(p.commandes || p.nombreCommandes || p.ventes || 0),
          }))
          .sort((a, b) => b.score - a.score)
          .slice(0, 5);

        const clientSeg = clients.map((c) => {
          const id = c.id ?? c.clientId;
          const rs = reservations.filter(
            (r) => String(r.clientId ?? r.client?.id ?? "") === String(id)
          );
          return { ...c, visits: rs.length };
        });

          regular = clientSeg.filter(
            (c) => c.visits >= 3 && c.visits < 10
          ).length,
          newClients = clientSeg.filter((c) => c.visits <= 1).length;

          const code = promoCode.trim().toUpperCase();

            { id: Date.now(), code, value: Number(promoValue), active: true },

      function CarteTableAdmin({ table, token, onChange }) {
        const [enEdition, setEnEdition] = useState(false);
        const [numero, setNumero] = useState(table.numero);
        const [capacite, setCapacite] = useState(table.capacite);
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);
        const [suppression, setSuppression] = useState(false);

        const handleChangerEtat = async (statut) => {
          setError("");
          try {
            const response = await apiFetch(
              `${API_URL}/tables/${table.id}/statut`,
              {
                method: "PATCH",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify({ statut }),
              }
            );
            const data = await response.json();
            if (!response.ok)
              throw new Error(data.error || "Erreur changement état");
            toast(`Table ${table.numero} → ${statut}`, "success");
            onChange();
          } catch (err) {
            setError(err.message);
            toast(err.message, "error");
          }
        };

        const handleSupprimer = async () => {
          const ok = await askConfirm({
            title: "Supprimer la table",
            message: `Voulez-vous vraiment supprimer la Table ${table.numero} ? Cette action est irréversible.`,
            confirmLabel: "Supprimer",
            tone: "danger",
          });
          if (!ok) return;

          setError("");
          setSuppression(true);
          try {
            const response = await apiFetch(`${API_URL}/tables/${table.id}`, {
              method: "DELETE",
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json();
            if (!response.ok)
              throw new Error(data.error || "Erreur suppression");
            toast(`Table ${table.numero} supprimée.`, "success");
            onChange();
          } catch (err) {
            setError(err.message);
            toast(err.message, "error");
          } finally {
            setSuppression(false);
          }
        };

        const handleEnregistrer = async () => {
          setError("");
          setLoading(true);
          try {
            const response = await apiFetch(`${API_URL}/tables/${table.id}`, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                numero: parseInt(numero),
                capacite: parseInt(capacite),
              }),
            });
            const data = await response.json();
            if (!response.ok)
              throw new Error(data.error || "Erreur modification");
            toast("Table modifiée avec succès.", "success");
            setEnEdition(false);
            onChange();
          } catch (err) {
            setError(err.message);
            toast(err.message, "error");
          } finally {
            setLoading(false);
          }
        };

        if (enEdition) {
          return (
            <div className="admin-table-card">
              <label className="field-label">Numéro</label>
              <input
                type="number"
                value={numero}
                onChange={(e) => setNumero(e.target.value)}
              />
              <label className="field-label">Capacité</label>
              <input
                type="number"
                value={capacite}
                onChange={(e) => setCapacite(e.target.value)}
              />
              <div className="etat-buttons">
                <button
                  onClick={handleEnregistrer}
                  disabled={loading}
                  style={{ margin: 0, background: "#4f8f86" }}
                >
                  {loading ? "..." : "Enregistrer"}
                </button>
                <button
                  onClick={() => setEnEdition(false)}
                  className="danger"
                  style={{ margin: 0 }}
                >
                  Annuler
                </button>
              </div>
              {error && (
                <p className="error" style={{ marginTop: 8 }}>
                  {error}
                </p>
              )}
            </div>
          );
        }

        return (
          <div className="admin-table-card">
            <div className="row">
              <strong>Table {table.numero}</strong>
              <span
                className={`badge-statut ${
                  table.statut === "Libre" ? "confirmee" : "annulee"
                }`}
              >
                {table.statut}
              </span>
            </div>
            <p
              style={{ margin: 0, color: "var(--ink-soft)", fontSize: "12px" }}
            >
              {table.capacite} personnes
            </p>
            <div className="etat-buttons">
              {["Libre", "Réservée", "Occupée"].map((s) => (
                <button
                  key={s}
                  onClick={() => handleChangerEtat(s)}
                  style={{
                    margin: 0,
                    background:
                      table.statut === s
                        ? "var(--navy-700)"
                        : "var(--ink-soft)",
                  }}
                >
                  {s}
                </button>
              ))}
            </div>
            <div className="etat-buttons">
              <button onClick={() => setEnEdition(true)} style={{ margin: 0 }}>
                Modifier
              </button>
              <button
                onClick={handleSupprimer}
                className="danger"
                disabled={suppression}
                style={{ margin: 0 }}
              >
                {suppression ? "..." : "Supprimer"}
              </button>
            </div>
            {error && (
              <p className="error" style={{ marginTop: 8 }}>
                {error}
              </p>
            )}
          </div>
        );
      }

      function SectionGererTables({ token }) {
        const [tables, setTables] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");
        const [numero, setNumero] = useState("");
        const [capacite, setCapacite] = useState("");
        const [addLoading, setAddLoading] = useState(false);
        const [showTableForm, setShowTableForm] = useState(false);
        const [showBulkForm, setShowBulkForm] = useState(false);

        // Ajout rapide (bulk)
        const [bulkDepart, setBulkDepart] = useState("");
        const [bulkQuantite, setBulkQuantite] = useState("");
        const [bulkCapacite, setBulkCapacite] = useState("");
        const [bulkLoading, setBulkLoading] = useState(false);

        const [suppressionLoading, setSuppressionLoading] = useState(false);

        const charger = () => {
          setLoading(true);
          apiFetch(`${API_URL}/tables`)
            .then((res) => res.json())
            .then((data) => setTables(Array.isArray(data) ? data : []))
            .catch(() => {
              setError("Erreur chargement tables");
              toast("Erreur chargement tables", "error");
            })
            .finally(() => setLoading(false));
        };

        useEffect(() => {
          charger();
        }, []);

        const handleAjouter = async (e) => {
          e.preventDefault();
          setError("");
          setAddLoading(true);
          try {
            const response = await apiFetch(`${API_URL}/tables`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                numero: parseInt(numero),
                capacite: parseInt(capacite),
              }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Erreur ajout");
            toast(`Table ${data.numero} ajoutée.`, "success");
            setNumero("");
            setCapacite("");
            charger();
          } catch (err) {
            setError(err.message);
            toast(err.message, "error");
          } finally {
            setAddLoading(false);
          }
        };

        // Ajoute plusieurs tables d'un coup avec numéros consécutifs
        const handleAjoutRapide = async (e) => {
          e.preventDefault();
          setError("");
          setBulkLoading(true);

          const depart = parseInt(bulkDepart);
          const quantite = parseInt(bulkQuantite);

                echecs++;

      const CATEGORIES_MENU_VOILIER = [
        "LES SALADES DU VOILIER",
        "LES ENTRÉES CHAUDES",
        "LES SPÉCIALITÉS EN PLAT",
        "LES PLATS",
        "LES PIZZAS",
        "LES DESSERTS",
        "EAU MINÉRALE",
        "SIROPS",
        "SODAS",
        "BOISSONS ÉNERGÉTIQUES",
      ];

      function categorieVoilier(categorie) {
        const c = (categorie || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
        if (c.includes("salad")) return "LES SALADES DU VOILIER";
        if (c.includes("entree") || c.includes("entrée"))
          return "LES ENTRÉES CHAUDES";
        if (c.includes("special") || c.includes("spécial"))
          return "LES SPÉCIALITÉS EN PLAT";
        if (c === "plat" || c === "plats" || c.includes("plat principal"))
          return "LES PLATS";
        if (c.includes("pizza")) return "LES PIZZAS";
        if (c.includes("dessert")) return "LES DESSERTS";
        if (c.includes("eau") || c.includes("mineral")) return "EAU MINÉRALE";
        if (c.includes("sirop")) return "SIROPS";
        if (c.includes("soda")) return "SODAS";
        if (c.includes("boisson energetique") || c.includes("energetique"))
          return "BOISSONS ÉNERGÉTIQUES";
        return categorie || "LES PLATS";
      }

      /* ================== CARTE PLAT (ADMIN) — CRUD + détails ================== */

                {plat.categorie && (

          try {
            const saved = localStorage.getItem("voilier_categories");

              ? [
                  ...CATEGORIES_MENU_VOILIER,
                  ...JSON.parse(saved).filter(
                    (c) => !CATEGORIES_MENU_VOILIER.includes(c)
                  ),

            return CATEGORIES_MENU_VOILIER;

        const [search, setSearch] = useState("");

          charger();

        const enregistrerCategories = (liste) => {
          setCategories(liste);
          localStorage.setItem("voilier_categories", JSON.stringify(liste));
        };

        const handleAjouterCategorie = (e) => {
          e.preventDefault();
          setError("");
          const nomCat = nouvelleCategorie.trim();
          if (!nomCat) return;

          if (
            categories.some(
              (c) => c.trim().toLowerCase() === nomCat.toLowerCase()

          ) {
            setError("Cette catégorie existe déjà.");

              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  marginBottom: "14px",
                }}
              >
                <h3 style={{ margin: 0 }}>Plats du menu ({plats.length})</h3>
                <button
                  type="button"
                  onClick={charger}
                  style={{
                    width: "auto",
                    margin: 0,
                    fontSize: "12px",
                    padding: "7px 14px",
                  }}
                >
                  Actualiser
                </button>
              </div>

              {loading ? (
                <AdminGridSkeleton count={3} />
              ) : plats.length === 0 ? (
                <EmptyState title="Aucun plat" subtitle="Le menu est vide." />
              ) : (
                (() => {
                  const terme = searchDebounced.trim().toLowerCase();
                  const platsRecherche = terme
                    ? plats.filter((p) =>
                        `${p.nom || ""} ${p.description || ""} ${
                          p.categorie || ""
                        }`
                          .toLowerCase()
                          .includes(terme)
                      )
                    : plats;

                  const totalPages = Math.max(
                    1,
                    Math.ceil(platsRecherche.length / pageSize)
                  );
                  const start = (page - 1) * pageSize;
                  const platsPage = platsRecherche.slice(
                    start,
                    start + pageSize
                  );

                  const groupes = {};
                  platsPage.forEach((plat) => {
                    const cle = plat.categorie || "Sans catégorie";
                    if (!groupes[cle]) groupes[cle] = [];
                    groupes[cle].push(plat);
                  });
                  const nomsCategories = Object.keys(groupes);

                  return (
                    <>
                      {nomsCategories.map((cat) => {
                        const estOuverte = categorieOuverte === cat;
                        return (
                          <div
                            key={cat}
                            style={{
                              border: "1.5px solid var(--line)",
                              borderRadius: 14,
                              marginBottom: 14,
                              overflow: "hidden",
                            }}
                          >
                            <button
                              type="button"
                              onClick={() =>
                                setCategorieOuverte(estOuverte ? null : cat)
                              }
                              style={{
                                width: "100%",
                                margin: 0,
                                padding: "16px 20px",
                                background: estOuverte
                                  ? "var(--navy-grad)"
                                  : "var(--sail-dim)",
                                color: estOuverte ? "#fff" : "var(--ink)",
                                border: "none",
                                borderRadius: 0,
                                display: "flex",
                                justifyContent: "space-between",
                                alignItems: "center",
                                fontSize: "14px",
                                fontWeight: 700,
                                letterSpacing: "0.3px",
                                cursor: "pointer",
                              }}
                            >
                              <span>
                                {cat}{" "}
                                <span
                                  style={{
                                    fontWeight: 500,
                                    opacity: 0.75,
                                    fontSize: "12px",
                                  }}
                                >
                                  ({groupes[cat].length})
                                </span>
                              </span>
                              <span style={{ fontSize: "13px" }}>
                                {estOuverte ? "▲" : "▼"}
                              </span>
                            </button>

                            {estOuverte && (
                              <div
                                className="admin-tables-grid"
                                style={{ padding: 18 }}
                              >
                                {groupes[cat].map((plat) => (
                                  <CartePlatAdmin
                                    key={plat.id}
                                    plat={plat}
                                    token={token}
                                    categories={categories}
                                    onChange={charger}
                                  />
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                      <PaginationControls
                        page={page}
                        totalPages={totalPages}
                        onPageChange={setPage}
                      />
                    </>
                  );
                })()
              )}
            </div>
          </>
        );
      }

      function SectionGererComptes({ token }) {
        const [clients, setClients] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");
        const [search, setSearch] = useState("");
        const searchDebounced = useDebouncedValue(search, 300);
        const [page, setPage] = useState(1);
        const pageSize = 10;

        const charger = () => {
          setLoading(true);
          apiFetch(`${API_URL}/clients`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => {
              if (!res.ok) throw new Error("");
              return res.json();
            })
            .then((data) => setClients(Array.isArray(data) ? data : []))
            .catch(() => {
              setError("Erreur chargement clients");
              toast("Erreur chargement clients", "error");
            })
            .finally(() => setLoading(false));
        };

        useEffect(() => {
          charger();
        }, []);

        useEffect(() => {
          setPage(1);
        }, [searchDebounced]);

        const handleToggle = async (id, actifActuel) => {
          setError("");
          try {
            const response = await apiFetch(`${API_URL}/clients/${id}/statut`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ actif: !actifActuel }),
            });
            const data = await response.json();
            if (!response.ok)
              throw new Error(data.error || "Erreur changement statut");
            toast("Statut mis à jour.", "success");
            charger();
          } catch (err) {
            setError(err.message);
            toast(err.message, "error");
          }
        };

        const filteredClients = clients.filter((c) =>
          `${c.nom || ""} ${c.prenom || ""} ${c.email || ""} ${
            c.telephone || ""
          }`
            .toLowerCase()
            .includes(searchDebounced.trim().toLowerCase())
        );
        const totalPages = Math.max(
          1,
          Math.ceil(filteredClients.length / pageSize)
        );
        const visibleClients = filteredClients.slice(
          (page - 1) * pageSize,
          page * pageSize
        );

        return (
          <>
            <div className="main-header">
              <h1>Comptes clients</h1>
              <p>Liste des clients et gestion de leur accès</p>
            </div>
            <div className="main-card">
              {error && <p className="error">{error}</p>}
              <div className="search-toolbar">
                <input
                  type="search"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Rechercher un client..."
                  aria-label="Rechercher un client"
                />
                <span className="pagination-info">
                  {filteredClients.length} résultat(s)
                </span>
              </div>

              {loading ? (
                <ReservationsListSkeleton />
              ) : clients.length === 0 ? (
                <EmptyState title="Aucun client" />
              ) : (
                visibleClients.map((c) => (
                  <div key={c.id} className="reservation-item">
                    <div className="row">
                      <strong>
                        {c.prenom} {c.nom}
                      </strong>
                      <span
                        className={`badge-statut ${
                          c.actif ? "confirmee" : "annulee"
                        }`}
                      >
                        {c.actif ? "Actif" : "Désactivé"}
                      </span>
                    </div>
                    <p>
                      {c.email} · {c.telephone || "Pas de téléphone"}
                    </p>
                    <button
                      onClick={() => handleToggle(c.id, c.actif)}
                      className={c.actif ? "danger" : ""}
                      style={{
                        width: "auto",
                        margin: "10px 0 0",
                        fontSize: "12px",
                        padding: "7px 14px",
                      }}
                    >
                      {c.actif ? "Désactiver" : "Activer"}
                    </button>
                  </div>
                ))
              )}
            </div>
          </>
        );
      }

      function SectionAvisPlats({ token }) {
        const [avisList, setAvisList] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");

        const charger = () => {
          setLoading(true);
          apiFetch(`${API_URL}/avis`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => {
              if (!res.ok) throw new Error("");
              return res.json();
            })
            .then((data) => {
              const plats = Array.isArray(data)
                ? data.filter((a) => a.plat)
                : [];
              setAvisList(plats);
            })
            .catch(() => {
              setError("Erreur chargement des avis des plats");
              toast("Erreur chargement des avis des plats", "error");
            })
            .finally(() => setLoading(false));
        };

        useEffect(() => {
          charger();
        }, []);

        return (
          <>
            <div className="main-header">
              <h1>Avis des plats</h1>
              <p>Notes et commentaires laissés par les clients sur les plats</p>
            </div>
            <div className="main-card">
              {error && <p className="error">{error}</p>}
              <div
                style={{
                  display: "flex",
                  justifyContent: "flex-end",
                  marginBottom: "14px",
                }}
              >
                <button
                  type="button"
                  onClick={charger}
                  style={{
                    width: "auto",
                    margin: 0,
                    fontSize: "12px",
                    padding: "7px 14px",
                  }}
                >
                  Actualiser
                </button>
              </div>

              {loading ? (
                <ReservationsListSkeleton />
              ) : avisList.length === 0 ? (
                <EmptyState
                  title="Aucun avis"
                  subtitle="Aucun avis sur les plats pour le moment."
                />
              ) : (
                avisList.map((a) => (
                  <div key={a.id} className="reservation-item">
                    <div className="row">
                      <strong>
                        {"⭐".repeat(a.note || 0)} ({a.note ?? "-"}/5)
                      </strong>
                      <span className="badge-statut confirmee">
                        Plat : {a.plat}
                      </span>
                    </div>
                    {a.commentaire && <p>{a.commentaire}</p>}
                    <p>
                      {a.client || "Client"} · {a.date || "-"}
                    </p>
                  </div>
                ))
              )}
            </div>
          </>
        );
      }

      function SectionParametresAdmin({ payload, onLogout }) {
        const roles = payload?.roles || [];
        const roleAffiche = roles.includes("ROLE_ADMIN") ? "Admin" : "Client";

        return (
          <>
            <div className="main-header">
              <h1>Paramètres</h1>
              <p>Informations du compte administrateur</p>
            </div>
            <div className="main-card">
              <div className="settings-row">
                <span>Email</span>
                <strong>{payload?.username || "-"}</strong>
              </div>
              <div className="settings-row">
                <span>Rôle</span>
                <strong>{roleAffiche}</strong>
              </div>
              <div className="settings-row">
                <span>Restaurant</span>
                <strong>Le Voilier — Hôtel El Mehdi</strong>
              </div>
              <div style={{ marginTop: "20px" }}>
                <button className="danger" onClick={onLogout}>
                  Se déconnecter
                </button>
              </div>
            </div>
          </>
        );
      }

      function AdminPage({ token, onLogout }) {
        const [section, setSection] = useState("stats");
        const [stats, setStats] = useState(null);
        const [reclamations, setReclamations] = useState([]);
        const [theme, setTheme] = useTheme();
        const [showMore, setShowMore] = useState(false);
        const [navOpen, setNavOpen] = useState(false);
        const payload = decodeJWT(token);

        const charger = () => {
          apiFetch(`${API_URL}/dashboard/stats`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => (res.ok ? res.json() : null))
            .then((data) => data && setStats(data))
            .catch(() => {});
          apiFetch(`${API_URL}/reclamations`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => (res.ok ? res.json() : []))
            .then((data) => setReclamations(Array.isArray(data) ? data : []))
            .catch(() => {});
        };

        useEffect(() => {
          charger();
        }, []);

        const navItems = [
          { key: "stats", icon: "📊", label: "Statistiques" },
          { key: "business", icon: "💰", label: "Business & Engagement" },
          { key: "tables", icon: "🍽️", label: "Gérer les tables" },
          { key: "comptes", icon: "👥", label: "Comptes clients" },
          { key: "menu", icon: "🍴", label: "Gérer le menu" },
          { key: "avis", icon: "⭐", label: "Avis plats" },
          { key: "reclamations", icon: "📩", label: "Réclamations" },
          { key: "parametres", icon: "⚙️", label: "Paramètres" },
        ];

        return (
          <div className="shell admin-shell">
            <div className="sidebar">
              <button
                className="sidebar-logo"
                onClick={() => setSection("stats")}
              >
                <img src="logo.png" alt="El Mehdi" />
                <h2>Le Voilier</h2>
              </button>
              <button
                type="button"
                className="nav-drawer-trigger"
                onClick={() => setNavOpen((v) => !v)}
                aria-label="Menu"
              >
                <span className="icon">☰</span>
              </button>
              {navOpen && (
                <div
                  className="mobile-backdrop"
                  onClick={() => setNavOpen(false)}
                />
              )}
              <div className={"sidebar-nav" + (navOpen ? " open" : "")}>
                {navItems.map((item) => (
                  <button
                    key={item.key}
                    className={section === item.key ? "active" : ""}
                    data-tooltip={item.label}
                    onClick={() => {
                      setSection(item.key);
                      setNavOpen(false);
                    }}
                  >
                    <span className="icon">{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </div>
              <div className="sidebar-footer-wrap">
                <button
                  type="button"
                  className="more-trigger"
                  onClick={() => setShowMore((v) => !v)}
                  aria-label="Plus d'options"
                >
                  <span className="icon">⋯</span>
                </button>
                {showMore && (
                  <div
                    className="mobile-backdrop"
                    onClick={() => setShowMore(false)}
                  />
                )}
                <div className={"sidebar-footer" + (showMore ? " open" : "")}>
                  <LanguageSwitcher />
                  <button
                    className="theme-toggle"
                    onClick={() =>
                      setTheme(theme === "dark" ? "light" : "dark")
                    }
                    title={theme === "dark" ? "Mode clair" : "Mode sombre"}
                  >
                    <span className="icon">
                      {theme === "dark" ? "☀️" : "🌙"}
                    </span>
                    <span className="footer-label">
                      {theme === "dark" ? "Mode clair" : "Mode sombre"}
                    </span>
                  </button>
                  <button
                    onClick={() => {
                      setShowMore(false);
                      onLogout();
                    }}
                  >
                    <span className="icon">🚪</span>
                    <span>Déconnexion</span>
                  </button>
                </div>
              </div>
            </div>

            <div className="main-content">
              {section === "stats" && <SectionStatistiques stats={stats} />}
              {section === "business" && <SectionBusinessHub token={token} />}
              {section === "tables" && <SectionGererTables token={token} />}
              {section === "menu" && <SectionGererMenu token={token} />}
              {section === "comptes" && <SectionGererComptes token={token} />}
              {section === "avis" && <SectionAvisPlats token={token} />}
              {section === "reclamations" && (
                <SectionReclamations
                  token={token}
                  reclamations={reclamations}
                  onChange={charger}
                />
              )}
              {section === "parametres" && (
                <SectionParametresAdmin payload={payload} onLogout={onLogout} />
              )}
            </div>
          </div>
        );
      }
      function QRCodeClient({ onGoToLogin }) {
        const qrRef = React.useRef(null);

        React.useEffect(() => {
          if (!qrRef.current) return;

          qrRef.current.innerHTML = "";

          // Le QR pointe vers le frontend public déployé.
          // window.location.origin récupère automatiquement le domaine
          // réel du site (ex. https://levoilier.netlify.app).
          const loginUrl =
            `${window.location.origin}${window.location.pathname}?page=login`;

          new QRCode(qrRef.current, {
            text: loginUrl,
            width: 200,
            height: 200,
            correctLevel: QRCode.CorrectLevel.H,
          });
        }, []);

        return (
          <div className="qr-client-content">
            <div className="qr-image-box">
              <div ref={qrRef} />
            </div>

            <small>Scannez avec votre téléphone</small>
          </div>
        );
      }

      function PublicRestaurantPage({ onGoToAdminLogin }) {
        return (
          <div className="public-home">
            <div className="public-home-header">
              <h1>LE VOILIER</h1>
              <p>HÔTEL EL MEHDI</p>
            </div>

            <div className="client-access-card">
              <div className="client-icon">📱</div>
              <h2>Accès Client</h2>
              <p>
                Scannez le QR Code pour accéder rapidement à votre espace
                client.
              </p>

              <QRCodeClient />

              <div className="qr-only-note">
                Accès client disponible uniquement via le QR Code
              </div>
            </div>

            <div className="mobile-only-note">
              <div className="client-icon">📱</div>
              <h2>Accès Client</h2>
              <p>
                Le QR Code s'affiche sur l'écran d'accueil du restaurant.
                Scannez-le avec ce téléphone pour accéder à votre espace.
              </p>
            </div>

            <button
              type="button"
              className="admin-access-btn"
              onClick={onGoToAdminLogin}
            >
              🔐 Accès Administrateur
            </button>
          </div>
        );
      }

      function App() {
        const [token, setToken] = useState(
          localStorage.getItem(ACCESS_TOKEN_KEY)
        );

        const [view, setView] = useState(() => {
          const params = new URLSearchParams(window.location.search);
          const page = params.get("page");

          if (page === "admin-login") return "admin-login";
          if (page === "login") return "login";
          if (page === "register") return "register";
          return "public";
        });

        const [registerMessage, setRegisterMessage] = useState("");

        // Applique le thème stocké dès le premier rendu (avant login aussi)
        useEffect(() => {
          startLanguageObserver();
          const saved = localStorage.getItem("voilier_theme") || "light";
          document.body.setAttribute("data-theme", saved);

          const checkSession = () => {
            const current = localStorage.getItem(ACCESS_TOKEN_KEY);
            if (current && tokenExpired(current)) {
              tryRefreshToken().then((fresh) => {
                if (!fresh) {
                  localStorage.removeItem(ACCESS_TOKEN_KEY);
                  localStorage.removeItem(REFRESH_TOKEN_KEY);
                  setToken(null);
                  setView("login");
                  window.history.replaceState(
                    {},
                    "",
                    window.location.pathname + "?page=login"
                  );
                  toast("Session expirée. Veuillez vous reconnecter.", "error");
                }
              });
            }
          };

          const onExpired = () => {
            localStorage.removeItem(ACCESS_TOKEN_KEY);
            localStorage.removeItem(REFRESH_TOKEN_KEY);
            setToken(null);
            setView("login");
            window.history.replaceState(
              {},
              "",
              window.location.pathname + "?page=login"
            );
            toast("Session expirée. Veuillez vous reconnecter.", "error");
          };

          const onRefreshed = (e) => setToken(e.detail);

          // Anti bfcache : si le navigateur restaure la page depuis son
          // cache mémoire (retour arrière, swipe mobile, changement d'onglet
          // puis retour), on force un rechargement complet pour relire l'état
          // réel de la session dans localStorage — sinon on ré-affiche
          // l'espace connecté (ou déconnecté) tel qu'il était figé en mémoire,
          // sans revalider quoi que ce soit (login/mot de passe contournés).
          const onPageShow = (e) => {
            if (e.persisted) {
              window.location.reload();
            }
          };
          window.addEventListener("pageshow", onPageShow);

          window.addEventListener("voilier-session-expired", onExpired);
          window.addEventListener("voilier-token-refreshed", onRefreshed);
          const timer = setInterval(checkSession, 15000);
          checkSession();

          return () => {
            clearInterval(timer);
            window.removeEventListener("pageshow", onPageShow);
            window.removeEventListener("voilier-session-expired", onExpired);
            window.removeEventListener("voilier-token-refreshed", onRefreshed);
          };
        }, []);

        const goToPage = (page) => {
          window.history.replaceState(
            {},
            "",
            window.location.pathname + "?page=" + page
          );
          setView(page);
        };

        const handleLogout = () => {
          localStorage.removeItem(ACCESS_TOKEN_KEY);
          localStorage.removeItem(REFRESH_TOKEN_KEY);

          // Reload complet (et non un simple setState + replaceState) :
          // ça vide entièrement la mémoire JS de la session en cours, donc
          // aucune trace de l'espace connecté ne peut être restaurée plus
          // tard par le bfcache du navigateur.
          // On revient sur la page d'accueil publique (QR client +
          // bouton Accès Administrateur), pas direct sur un formulaire de
          // login, pour que la personne puisse re-choisir son chemin.
          window.location.replace(window.location.pathname);
        };

        const handleRegisterSuccess = (email) => {
          setRegisterMessage(
            `Compte créé pour ${email} ! Vous pouvez vous connecter.`
          );
          goToPage("login");
        };

        let content;

        if (!token) {
          if (view === "public") {
            content = (
              <PublicRestaurantPage
                onGoToAdminLogin={() => goToPage("admin-login")}
              />
            );
          } else if (view === "register") {
            content = (
              <RegisterPage
                onRegisterSuccess={handleRegisterSuccess}
                onGoToLogin={() => goToPage("login")}
              />
            );
          } else if (view === "admin-login") {
            content = (
              <LoginPage
                adminOnly
                onLoginSuccess={setToken}
                onGoToHome={() => goToPage("public")}
              />
            );
          } else {
            content = (
              <>
                <LoginPage
                  onLoginSuccess={setToken}
                  onGoToHome={() => goToPage("public")}
                  onGoToRegister={() => {
                    setRegisterMessage("");
                    goToPage("register");
                  }}
                />

                {registerMessage && (
                  <p
                    className="success"
                    style={{ maxWidth: "420px", margin: "-20px auto 0" }}
                  >
                    {registerMessage}
                  </p>
                )}
              </>
            );
          }
        } else {
          const payload = decodeJWT(token);
          const isAdmin =
            payload && payload.roles && payload.roles.includes("ROLE_ADMIN");

          content = isAdmin ? (
            <AdminPage token={token} onLogout={handleLogout} />
          ) : (
            <ReservationPage token={token} onLogout={handleLogout} />
          );
        }

        return (
          <>
            <ToastStack />
            <ConfirmModal />
            {content}
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
